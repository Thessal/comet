[package]
name = "runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "comet_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tch = "0.22.0"
stdlib = { path = "../stdlib" }
parser = { path = "../parser" }
rand = "0.8"
thiserror = "1.0"
lru = "0.16.3"
csv = "1.4.0"
flate2 = "1.1.9"
inventory = "0.3.22"
libc = "0.2"
serde_json = "1.0.150"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
